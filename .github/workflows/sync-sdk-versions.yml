name: Sync SDK Versions

on:
  schedule:
    - cron: "30 6 * * *" # Daily at 06:30 UTC (after documentation sync)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest versions
        id: versions
        run: |
          JS_VERSION=$(curl -sf https://registry.npmjs.org/@gladiaio/sdk/latest | jq -r '.version')
          PY_VERSION=$(curl -sf https://pypi.org/pypi/gladiaio-sdk/json | jq -r '.info.version')
          echo "js=$JS_VERSION" >> "$GITHUB_OUTPUT"
          echo "py=$PY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read current versions
        id: current
        run: |
          FILE="plugins/gladia/skills/sdk-integration/references/sdk-versions.md"
          if [ -f "$FILE" ]; then
            CURRENT_JS=$(grep -oP '@gladiaio/sdk`\s+\|\s+\K[0-9]+\.[0-9]+\.[0-9]+' "$FILE" || echo "none")
            CURRENT_PY=$(grep -oP 'gladiaio-sdk`\s+\|\s+\K[0-9]+\.[0-9]+\.[0-9]+' "$FILE" || echo "none")
          else
            CURRENT_JS="none"
            CURRENT_PY="none"
          fi
          echo "js=$CURRENT_JS" >> "$GITHUB_OUTPUT"
          echo "py=$CURRENT_PY" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          if [ "${{ steps.versions.outputs.js }}" = "${{ steps.current.outputs.js }}" ] && \
             [ "${{ steps.versions.outputs.py }}" = "${{ steps.current.outputs.py }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Versions changed: JS ${{ steps.current.outputs.js }} → ${{ steps.versions.outputs.js }}, Python ${{ steps.current.outputs.py }} → ${{ steps.versions.outputs.py }}"
          fi

      - name: Update sdk-versions.md
        if: steps.check.outputs.changed == 'true'
        run: |
          TODAY=$(date +%Y-%m-%d)
          JS="${{ steps.versions.outputs.js }}"
          PY="${{ steps.versions.outputs.py }}"

          {
            echo "# SDK Versions"
            echo ""
            echo "> This file is auto-synced by CI. Do not edit manually — changes will be overwritten."
            echo ""
            echo "| SDK | Package | Latest Version | Registry |"
            echo "| --- | --- | --- | --- |"
            echo "| JavaScript/TypeScript | \`@gladiaio/sdk\` | $JS | [npm](https://www.npmjs.com/package/@gladiaio/sdk) |"
            echo "| Python | \`gladiaio-sdk\` | $PY | [PyPI](https://pypi.org/project/gladiaio-sdk/) |"
            echo ""
            echo "Last synced: $TODAY"
            echo ""
            echo "Always install without pinning a version to get the latest release:"
            echo ""
            printf '%s\n' '```bash'
            echo "# JS/TS"
            echo "npm install @gladiaio/sdk"
            echo ""
            echo "# Python"
            echo "pip install gladiaio-sdk"
            printf '%s\n' '```'
          } > plugins/gladia/skills/sdk-integration/references/sdk-versions.md

      - name: Update JS reference
        if: steps.check.outputs.changed == 'true'
        run: |
          FILE="plugins/gladia/skills/sdk-integration/references/javascript.md"
          if [ -f "$FILE" ]; then
            sed -i "s/- \*\*Version\*\*: .*/- **Version**: ${{ steps.versions.outputs.js }}/" "$FILE"
          fi

      - name: Update Python reference
        if: steps.check.outputs.changed == 'true'
        run: |
          FILE="plugins/gladia/skills/sdk-integration/references/python.md"
          if [ -f "$FILE" ]; then
            sed -i "s/- \*\*Version\*\*: .*/- **Version**: ${{ steps.versions.outputs.py }}/" "$FILE"
          fi

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync SDK versions (JS ${{ steps.versions.outputs.js }}, Python ${{ steps.versions.outputs.py }})"
          branch: auto/sync-sdk-versions
          delete-branch: true
          title: "chore: sync SDK versions (JS ${{ steps.versions.outputs.js }}, Python ${{ steps.versions.outputs.py }})"
          body: |
            Automated update of SDK version references.

            | SDK | Previous | New |
            | --- | --- | --- |
            | JS/TS | `${{ steps.current.outputs.js }}` | `${{ steps.versions.outputs.js }}` |
            | Python | `${{ steps.current.outputs.py }}` | `${{ steps.versions.outputs.py }}` |

            This PR was auto-generated by the [sync-sdk-versions workflow](.github/workflows/sync-sdk-versions.yml).
          labels: |
            automated
            documentation
