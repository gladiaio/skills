name: Publish skills to ClawHub

on:
  push:
    branches: [main]
    paths:
      - "plugins/gladia/skills/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@6fc5bb7cd80f8efc020bfc787b0b2ad2de017147
    with:
      root: plugins/gladia/skills
      dry_run: false
      owner: gladiaio
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_API_TOKEN }}
